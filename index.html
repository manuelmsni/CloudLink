<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>CloudLink</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script type="importmap">
  {
    "imports": {
      "@codemirror/state":          "https://esm.sh/@codemirror/state@6.4.1",
      "@codemirror/view":           "https://esm.sh/@codemirror/view@6.26.3?external=@codemirror/state",
      "@codemirror/commands":       "https://esm.sh/@codemirror/commands@6.5.0?external=@codemirror/state,@codemirror/view",
      "@codemirror/language":       "https://esm.sh/@codemirror/language@6.10.1?external=@codemirror/state,@codemirror/view",
      "@codemirror/lang-markdown":  "https://esm.sh/@codemirror/lang-markdown@6.2.5?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands",
      "@codemirror/search":         "https://esm.sh/@codemirror/search@6.5.6?external=@codemirror/state,@codemirror/view"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    #app-launcher {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1b2e 100%);
      color: #e5e7eb;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    #app-launcher[data-theme="light"] {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ef 100%);
      color: #1a1a2e;
    }

    #app-launcher .launcher-card {
      background: #23242c;
      border-radius: 16px;
      padding: clamp(24px, 6vw, 48px) clamp(16px, 5vw, 40px) clamp(24px, 5vw, 40px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 480px;
      width: 100%;
      position: relative;
      transition: background 0.3s, box-shadow 0.3s;
    }

    #app-launcher[data-theme="light"] .launcher-card {
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    #app-launcher .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.4s;
      color: #e5e7eb;
    }

    #app-launcher .theme-toggle:hover {
      background: rgba(255,255,255,0.08);
    }

    #app-launcher[data-theme="light"] .theme-toggle {
      color: #1a1a2e;
    }

    #app-launcher[data-theme="light"] .theme-toggle:hover {
      background: rgba(0,0,0,0.06);
    }

    #app-launcher .theme-toggle:active {
      transform: scale(0.9);
    }

    #app-launcher .launcher-logo {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
    }

    #app-launcher h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
      color: #e5e7eb;
      letter-spacing: -0.02em;
      transition: color 0.3s;
    }

    #app-launcher[data-theme="light"] h1 {
      color: #1a1a2e;
    }

    #app-launcher .launcher-sub {
      font-size: 14px;
      color: #9ca3af;

    #app-launcher[data-theme="light"] .launcher-sub {

    }

    #app-launcher #loginBtn {

      align-items: center;

      font-size: 15px;

      border-radius: 8px;

    #app-launcher #loginBtn:hover {

    #app-launcher #login-section--hidden {

    #app-launcher #app .app-status {
      font-size: 14px;
      color: #9ca3af;
      margin: 8px 0;
      text-align: center;
    }

    #app-launcher[data-theme="light"] #app .app-status {
      color: #6b7280;
    }

    #app-launcher #app .app-status--error {
      color: #f87171 !important;
      font-weight: 500;
    }

    #app-launcher #app .app-welcome {
      font-size: 13px;
      color: #9ca3af;
      margin: 0 0 16px;
      text-align: center;
    }

    #app-launcher[data-theme="light"] #app .app-welcome {
      color: #6b7280;
    }

    #app-launcher #app .app-list-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin: 0 0 12px;
      text-align: center;
    }

    #app-launcher #app .app-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin: 8px 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
    }

    #app-launcher[data-theme="light"] #app .app-card {
      background: #f8f9fa;
      border-color: #e5e7eb;

    #app-launcher #app .app-card:hover {
      background: rgba(124,58,237,0.08);
      border-color: #7c3aed;

    #app-launcher[data-theme="light"] #app .app-card:hover {

    #app-launcher #app .app-card:active {
      transform: translateX(0);

    #app-launcher #app .app-card-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 44px;

      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;

    #app-launcher[data-theme="light"] #app .app-card-icon {

    }

    #app-launcher #app .app-card-info {
      flex: 1;

    }

    #app-launcher #app .app-card-name {
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    #app-launcher[data-theme="light"] #app .app-card-name {
      color: #1a1a2e;
    }

    #app-launcher #app .app-card-desc {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
      line-height: 1.4;
    }

    #app-launcher[data-theme="light"] #app .app-card-desc {
      color: #6b7280;
    }

    #app-launcher .public-section {
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 16px;
    }

    #app-launcher[data-theme="light"] .public-section {
      border-top-color: #e5e7eb;
    }

    #app-launcher .public-section .public-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin: 0 0 12px;
      text-align: center;
    }

    #app-launcher .login-hint {
      font-size: 13px;
      color: #7c3aed;
      text-align: center;
      margin: 20px 0 0;
      cursor: pointer;
      transition: opacity 0.15s;
      background: none;

<body style="margin:0;touch-action:manipulation">

  <div id="app-launcher" data-theme="dark">
    <div class="launcher-card">

      <button class="theme-toggle" id="themeToggle" title="Cambiar tema">☀️</button>

      <div id="login-section">
        <div class="launcher-logo">🌐</div>
        <h1>CloudLink</h1>
        <p class="launcher-sub">Inicia sesión para acceder a apps privadas</p>
        <button id="loginBtn">Iniciar sesión con Google</button>
      </div>

      <div id="app"></div>

    </div>
  </div>

<script>
const CLIENT_ID = "67534313330-c6tea2ap05e76i5bh794hamab3pme1n9.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/drive.appdata openid profile email";

const CSV_FILE_ID = "16JMnnkNn6v9BD3lSBmyxXz-vStk8FpXfpXRwK2F696Y";
const PUBLIC_SHEET_ID = "1LJaKK1PDjHhnrTnVsukO0tvzCHsaT_pXZJzm99p27o4";
const DRIVE_API_KEY = "AIzaSyDSImblYc3KTughQE8SSJfLJvYReRvBHA4";
const BASE_PATH = "/CloudLink";

const PENDING_APP_KEY = "cv.pendingApp";

let tokenClient;
let accessToken = null;
let publicApps = [];
let privateApps = [];

const app = document.getElementById("app");
const launcher = document.getElementById("app-launcher");
const loginSection = document.getElementById("login-section");

document.getElementById("themeToggle").onclick = () => {
  const isDark = launcher.getAttribute("data-theme") !== "light";
  launcher.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("themeToggle").textContent = isDark ? "🌙" : "☀️";
};

window.onload = () => {
  console.debug("[CloudLink] window.onload", {
    pathname: window.location.pathname,
    href: window.location.href,
    BASE_PATH,
  });

  if (!window.google?.accounts?.oauth2) {
    console.debug("[CloudLink] GSI no disponible");
    return showInitError("Google Identity Services no se ha cargado. Recarga la página.");
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (tokenResponse) => {
      console.debug("[CloudLink] OAuth callback", { expires_in: tokenResponse.expires_in });
      accessToken = tokenResponse.access_token;
      window.__launcher = {
        accessToken,
        clientId: CLIENT_ID,
        tokenExpiresAt: Date.now() + (tokenResponse.expires_in - 60) * 1000,
      };
      startApp();
    }
  });

  document.getElementById("loginBtn").onclick = () => {
    console.debug("[CloudLink] loginBtn clicked");
    tokenClient.requestAccessToken();
  };

  loadPublicCatalog();

  function onNav() {
    const name = appNameFromPath();
    console.debug("[CloudLink] onNav", { name, hash: window.location.hash, pathname: window.location.pathname });
    if (name) {
      const pub = publicApps.find(a => a.name === name);
      if (pub) loadPublicBundle(pub.name, pub.bundleurl);
    }
  }
  window.addEventListener("popstate", onNav);
  window.addEventListener("hashchange", onNav);
};

async function loadPublicCatalog() {
  console.debug("[CloudLink] loadPublicCatalog");
  const apps = await fetchPublicCSV();
  publicApps = apps;
  console.debug("[CloudLink] publicApps", apps);

  const pathApp = appNameFromPath();
  console.debug("[CloudLink] pathApp from URL", pathApp);
  if (pathApp) {
    const match = apps.find(a => a.name === pathApp);
    if (match) {
      console.debug("[CloudLink] auto-loading public app", pathApp);
      loadPublicBundle(match.name, match.bundleurl);
      return;
    }
    console.debug("[CloudLink] app not found in public catalog, flagging as pending", pathApp);
    setPendingApp(pathApp);
    renderStatus("App no encontrada. Inicia sesión para intentar con tu catálogo privado.");
    return;
  }

  if (apps.length > 0) {
    console.debug("[CloudLink] rendering", apps.length, "public apps");
    renderPublicAppList(apps);
  }
}

function showInitError(msg) {
  document.getElementById("app").innerHTML =
    "<p class='app-status app-status--error'>" + msg + "</p>";
}

async function startApp() {
  console.debug("[CloudLink] startApp");
  loginSection.style.display = "none";

  renderStatus("Obteniendo usuario...");

  const user = await getUserInfo();
  console.debug("[CloudLink] user", user);
  privateApps = [];

  try {
    const bundles = await fetchCSV();
    console.debug("[CloudLink] CSV bundles", bundles);

    renderStatus("Verificando acceso...");
    const results = await Promise.allSettled(bundles.map(b => {
      // Solo verificamos permisos vía API para orígenes de Drive.
      if (b.source && b.source.type === "drive") {
        return fetch("https://www.googleapis.com/drive/v3/files/" + b.source.id + "?fields=id", {
          headers: { Authorization: "Bearer " + accessToken }
        }).then(r => r.ok);
      }
      // URLs directas: no se pueden pre-verificar (CORS) -> se asumen accesibles.
      return Promise.resolve(true);
    }));
    const accesibles = bundles.filter((_, i) => results[i].status === "fulfilled" && results[i].value === true);
    privateApps = accesibles;
    console.debug("[CloudLink] accessible bundles", accesibles.length, "/", bundles.length);

    const pending = getPendingApp();
    console.debug("[CloudLink] pending app after login", pending);
    if (pending) {
      const match = accesibles.find(b => b.name === pending);
      if (match) {
        console.debug("[CloudLink] resolving pending app", pending);
        clearPendingApp();
        updateUrlForApp(pending);
        loadBundle(match);
        return;
      }
      console.debug("[CloudLink] pending app not in accessible list, clearing");
      clearPendingApp();
    }

    if (accesibles.length === 0 && publicApps.length === 0) {
      renderError("No tienes acceso a ninguna aplicación");
      return;
    }

    renderCombinedBundles(accesibles, publicApps, user);

  } catch (err) {
    console.debug("[CloudLink] startApp catch", err.message);
    if (publicApps.length > 0) {
      renderCombinedBundles([], publicApps, user);
    } else {
      renderError("Usuario no registrado en La Alfa");
    }
  }
}

async function getUserInfo() {
  const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
    headers: { Authorization: "Bearer " + accessToken }
  });
  return await res.json();
}

async function fetchCSV() {
  console.debug("[CloudLink] fetchCSV");
  const res = await fetch(
    `https://docs.google.com/spreadsheets/d/${CSV_FILE_ID}/export?format=csv`,
    {
      headers: { Authorization: "Bearer " + accessToken }
    }
  );

  console.debug("[CloudLink] CSV fetch status", res.status);
  if (res.status === 403) throw new Error("NO_PERMISSION");
  if (!res.ok) throw new Error("ERROR");

  const text = await res.text();
  console.debug("[CloudLink] CSV length", text.length);
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];

  // Cabecera: detecta columnas por nombre; si no las encuentra, cae a posiciones.
  const header = parseCSVLine(lines[0]).map(s => s.trim().toLowerCase());
  const findCol = (aliases, fallback) => {
    for (const a of aliases) {
      const i = header.indexOf(a);
      if (i !== -1) return i;
    }
    return fallback;
  };

  const iName   = findCol(["name", "nombre"], 0);
  // La columna de origen puede llamarse de muchas formas y contener un ID de Drive
  // o una URL/enlace directo. Se acepta un abanico amplio de alias.
  const iSource = findCol(["source", "origen", "bundle", "bundleurl", "url", "fileid", "gid", "driveid", "file", "id"], 1);
  const iIcon   = findCol(["icon", "icono"], 2);
  const iDesc   = findCol(["description", "descripcion", "descripción", "desc"], 3);

  return lines.slice(1).map(line => {
    const cols = parseCSVLine(line);
    const name = (cols[iName] || "").trim();
    const sourceRaw = (cols[iSource] || "").trim();
    const icon = (cols[iIcon] || "").trim() || "⬡";
    const description = (cols[iDesc] || "").trim();
    const source = resolveBundleSource(sourceRaw);
    return {
      name,
      sourceRaw,
      source,
      // fileId se conserva por compatibilidad (útil si el origen es un ID/enlace de Drive).
      fileId: source && source.type === "drive" ? source.id : "",
      icon,
      description
    };
  }).filter(b => b.name && b.source);
}

// Detecta qué tipo de dato hay en la columna de origen y cómo debe descargarse.
//  - "drive": ID de Drive o enlace de Drive -> API de Drive autenticada
//  - "url":   cualquier otra URL/enlace directo -> fetch normal
function resolveBundleSource(raw) {
  const value = String(raw || "").trim();
  if (!value) return null;

  // ¿Es una URL completa?
  if (/^https?:\/\//i.test(value)) {
    const driveId = extractDriveId(value);
    if (driveId) return { type: "drive", id: driveId, raw: value };
    return { type: "url", url: value, raw: value };
  }

  // Token "pelado": lo tratamos como ID de Drive (gid).
  if (/^[A-Za-z0-9_-]{16,}$/.test(value)) {
    return { type: "drive", id: value, raw: value };
  }

  // Cualquier otra cosa (p. ej. ruta relativa) -> se intenta como URL.
  return { type: "url", url: value, raw: value };
}

// Extrae el ID de Drive de las formas habituales de enlace.
function extractDriveId(url) {
  let m = url.match(/\/d\/([A-Za-z0-9_-]{16,})/);          // .../file/d/ID/view, .../d/ID/...
  if (m) return m[1];
  m = url.match(/[?&]id=([A-Za-z0-9_-]{16,})/);            // uc?export=download&id=ID, open?id=ID
  if (m) return m[1];
  return null;
}

// URL de descarga de un archivo PÚBLICO de Drive sin sesión.
// Con API key usamos la Drive API (googleapis.com envía cabeceras CORS -> el fetch funciona).
// Sin API key, caemos al endpoint clásico (que suele fallar por CORS desde el navegador).
function publicDriveUrl(id) {
  if (DRIVE_API_KEY) {
    return "https://www.googleapis.com/drive/v3/files/" + id + "?alt=media&key=" + DRIVE_API_KEY;
  }
  return "https://drive.google.com/uc?export=download&id=" + id;
}

function appNameFromPath() {
  var hash = window.location.hash.replace(/^#!?/, "").replace(/\/+$/, "");
  if (hash) {
    var parts = hash.split("/").filter(Boolean);
    if (parts.length > 0) {
      console.debug("[CloudLink] appNameFromPath (hash)", { hash, result: parts[0] });
      return parts[0];
    }
  }
  var p = window.location.pathname.replace(/\/+$/, "") || "/";
  var raw = p;
  if (BASE_PATH && p.startsWith(BASE_PATH)) {
    p = p.slice(BASE_PATH.length) || "/";
  }
  var result = (p === "/" || p === "/index.html") ? null : p.split("/").filter(Boolean)[0] || null;
  console.debug("[CloudLink] appNameFromPath (pathname)", { raw, BASE_PATH, stripped: p, result });
  return result;
}

function updateUrlForApp(name) {
  var u = new URL(window.location);
  u.hash = "/" + name + "/";
  console.debug("[CloudLink] updateUrlForApp", { name, href: u.href });
  window.history.pushState({ app: name }, "", u);
}

function setPendingApp(name) { try { console.debug("[CloudLink] setPendingApp", name); sessionStorage.setItem(PENDING_APP_KEY, name); } catch {} }
function getPendingApp() { try { const v = sessionStorage.getItem(PENDING_APP_KEY); console.debug("[CloudLink] getPendingApp", v); return v; } catch { return null; } }
function clearPendingApp() { try { console.debug("[CloudLink] clearPendingApp"); sessionStorage.removeItem(PENDING_APP_KEY); } catch {} }

async function fetchPublicCSV() {
  console.debug("[CloudLink] fetchPublicCSV", { PUBLIC_SHEET_ID });
  if (!PUBLIC_SHEET_ID) return [];
  return new Promise(resolve => {
    const callbackName = "_cv" + Math.random().toString(36).slice(2);
    const base = "https://docs.google.com/spreadsheets/d/" + PUBLIC_SHEET_ID + "/gviz/tq";
    const url = base + "?tqx=responseHandler:" + callbackName;
    console.debug("[CloudLink] JSONP url", url);

    window[callbackName] = data => {
      cleanup();
      console.debug("[CloudLink] JSONP response", data.status);
      if (data.status !== "ok") {
        console.debug("[CloudLink] JSONP error", data.errors);
        renderStatus("Catálogo público: " + (data.errors?.[0]?.message || "error"));
        resolve([]);
        return;
      }
      const raw = data.table.rows.map(r => r.c.map(cell => cell?.v ?? ""));
      console.debug("[CloudLink] JSONP raw rows", raw.length);
      if (raw.length < 2) {
        renderStatus("Catálogo público vacío");
        resolve([]);
        return;
      }
      const headers = raw[0].map(v => String(v).toLowerCase());
      const apps = raw.slice(1).map(row => {
        const o = {};
        headers.forEach((h, i) => { o[h] = row[i] || ""; });
        return o;
      }).filter(a => a.name).map(a => {
        // Autodetecta el origen igual que en la hoja privada: gid, enlace de Drive o URL.
        const rawSrc = a.bundleurl || a.fileid || a.url || a.source || a.gid || a.driveid || "";
        a.source = resolveBundleSource(rawSrc);
        a.bundleurl = rawSrc; // valor canónico; loadPublicBundle lo resuelve al cargar
        return a;
      }).filter(a => a.source);
      console.debug("[CloudLink] parsed public apps", apps);
      if (apps.length === 0) renderStatus("Catálogo público vacío o formato incorrecto");
      resolve(apps);
    };

    const script = document.createElement("script");
    script.src = url;
    script.onerror = (ev) => {
      cleanup();
      console.debug("[CloudLink] JSONP script onerror", ev);
      renderStatus("Error de red al cargar catálogo público");
      resolve([]);
    };
    document.head.appendChild(script);

    function cleanup() {
      delete window[callbackName];
      script.remove();
    }
  });
}

function parsePublicCSV(text) {
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const h = lines[0].split(",").map(s => s.trim().toLowerCase());
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const o = {};
    h.forEach((k, i) => { o[k] = vals[i] || ""; });
    return o;
  }).filter(a => a.name && a.bundleurl);
}

function parseCSVLine(line) {
  const r = [];
  let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { q = !q; }
    else if (c === "," && !q) { r.push(cur); cur = ""; }
    else { cur += c; }
  }
  r.push(cur);
  return r;
}

function renderStatus(msg) {
  app.innerHTML = "<p class='app-status'>" + msg + "</p>";
}

function renderError(msg) {
  app.innerHTML = "<p class='app-status app-status--error'>" + msg + "</p>";
}

function renderCombinedBundles(privateList, publicList, user) {
  const welcome = user ? "<p class='app-welcome'>Bienvenido, " + (user.name || user.email || "Usuario") + "</p>" : "";
  let html = welcome;

  if (privateList.length > 0) {
    html += "<p class='app-list-title'>Tus aplicaciones</p>";
  }

  app.innerHTML = html;

  privateList.forEach(b => {
    const card = appCard(b.name, b.icon, b.description, () => { updateUrlForApp(b.name); loadBundle(b); });
    app.appendChild(card);
  });

  if (publicList.length > 0) {
    const section = document.createElement("div");
    section.className = "public-section";
    section.innerHTML = "<p class='public-title'>Apps públicas (sin login)</p>";
    publicList.forEach(b => {
      const card = appCard(b.name, b.icon || b.icono, b.description, () => loadPublicBundle(b.name, b.bundleurl));
      section.appendChild(card);
    });
    app.appendChild(section);
  }
}

function renderPublicAppList(publicList) {
  if (publicList.length === 0) return;
  app.innerHTML = "<p class='app-list-title'>Apps públicas (sin login)</p>";
  publicList.forEach(b => {
    app.appendChild(appCard(b.name, b.icon || b.icono, b.description, () => loadPublicBundle(b.name, b.bundleurl)));
  });
}

function appCard(name, icon, desc, onclick) {
  const card = document.createElement("div");
  card.className = "app-card";
  card.innerHTML =
    "<div class='app-card-icon'>" + (icon || "⬡") + "</div>" +
    "<div class='app-card-info'>" +
      "<div class='app-card-name'>" + name + "</div>" +
      "<div class='app-card-desc'>" + (desc || "") + "</div>" +
    "</div>";
  card.onclick = onclick;
  return card;
}

async function loadBundle(bundle) {
  // Acepta un objeto bundle, un origen ya resuelto, o un string (ID/URL) por compatibilidad.
  let source;
  if (typeof bundle === "string") {
    source = resolveBundleSource(bundle);
  } else if (bundle && bundle.type) {
    source = bundle;
  } else if (bundle) {
    source = bundle.source || resolveBundleSource(bundle.sourceRaw || bundle.fileId);
  }

  console.debug("[CloudLink] loadBundle", source);
  document.body.innerHTML = loadingHTML();

  try { localStorage.setItem("cv.drive.clientId", CLIENT_ID); } catch {}

  const code = await downloadBundleCode(source);
  console.debug("[CloudLink] bundle length", code.length);

  const blob = new Blob([code], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  const mod = await import(url);
  console.debug("[CloudLink] module loaded, calling initApp");
  await mod.initApp();
}

// Descarga el código del bundle según el tipo de origen autodetectado.
async function downloadBundleCode(source) {
  if (!source) throw new Error("NO_SOURCE");

  if (source.type === "drive") {
    // ID/enlace de Drive -> API de Drive autenticada.
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files/${source.id}?alt=media`,
      { headers: { Authorization: "Bearer " + accessToken } }
    );
    console.debug("[CloudLink] Drive fetch status", res.status);
    if (!res.ok) throw new Error("DRIVE_FETCH_" + res.status);
    return res.text();
  }

  // URL/enlace directo -> fetch normal. Solo se adjunta el token para googleapis.com.
  let isGoogleApi = false;
  try {
    isGoogleApi = /(^|\.)googleapis\.com$/i.test(new URL(source.url, window.location.href).hostname);
  } catch {}
  const res = await fetch(source.url, isGoogleApi
    ? { headers: { Authorization: "Bearer " + accessToken } }
    : {});
  console.debug("[CloudLink] URL fetch status", res.status);
  if (!res.ok) throw new Error("URL_FETCH_" + res.status);
  return res.text();
}

async function loadPublicBundle(name, bundleUrl) {
  console.debug("[CloudLink] loadPublicBundle", { name, bundleUrl });
  updateUrlForApp(name);
  clearPendingApp();
  document.body.innerHTML = loadingHTML();

  const source = resolveBundleSource(bundleUrl);
  console.debug("[CloudLink] public source resolved", source);

  let code;
  if (source && source.type === "drive") {
    if (accessToken) {
      // Con sesión: API de Drive autenticada (evita CORS y sirve para archivos privados).
      code = await downloadBundleCode(source);
    } else {
      // Sin sesión: descarga del archivo PÚBLICO de Drive vía API key (CORS-safe).
      if (!DRIVE_API_KEY) {
        console.warn("[CloudLink] DRIVE_API_KEY vacía: la descarga pública de Drive fallará por CORS.");
      }
      const res = await fetch(publicDriveUrl(source.id));
      console.debug("[CloudLink] public Drive fetch status", res.status);
      if (!res.ok) throw new Error("PUBLIC_DRIVE_" + res.status);
      code = await res.text();
    }
  } else {
    // URL/enlace directo.
    const target = source ? source.url : bundleUrl;
    const res = await fetch(target);
    console.debug("[CloudLink] public bundle fetch status", res.status);
    if (!res.ok) throw new Error("PUBLIC_URL_" + res.status);
    code = await res.text();
  }
  console.debug("[CloudLink] public bundle length", code.length);

  const blob = new Blob([code], { type: "text/javascript" });
  const u = URL.createObjectURL(blob);
  const mod = await import(u);
  console.debug("[CloudLink] public module loaded, calling initApp");
  await mod.initApp();
}

function loadingHTML() {
  const isDark = launcher.getAttribute("data-theme") !== "light";
  return "<div style='display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:" + (isDark ? "#0f0f1a" : "#f5f7fa") + ";margin:0;padding:16px'><p style='font-family:system-ui;color:" + (isDark ? "#9ca3af" : "#6b7280") + "'>Cargando...</p></div>";
}
